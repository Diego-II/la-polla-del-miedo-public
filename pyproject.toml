[project]
name = "polla"
version = "0.1.0"
description = "World Cup 2026 polla predictions + auto-submit for toqui.app"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "requests>=2.32",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
infra = ["boto3>=1.35"]
toqui = ["playwright>=1.49"]
llm = ["pydantic-ai>=0.0.30"]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polla"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
